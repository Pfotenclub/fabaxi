name: CI/CD & Kubernetes GitOps Release

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".vscode/**"
      - ".agents/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITOPS_REPO: pfotenclub/fabaxi-gitops

jobs:
  validate:
    name: Validate Code & ORM Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax, config.example.toml & ORM models
        run: |
          python -m py_compile fabaxi.py app/core/config.py db/__init__.py db/tables.py db/bot_state.py ext/api.py app/cogs/*.py
          python -c "
          import app.core.config as cfg
          assert cfg.CONFIG_FILE is not None and cfg.CONFIG_FILE.exists(), 'config.example.toml not found'
          assert cfg.CURRENT_GUILD_ID > 0, 'Invalid server_id in config.example.toml'
          import db.tables
          from db import Base
          expected = {'birthdays', 'karma', 'rewards', 'temp_voice', 'counting_state', 'gtn_state', 'role_color_state'}
          assert expected.issubset(set(Base.metadata.tables.keys()))
          print('Config & ORM validation passed!')
          "

  build-and-release:
    name: Build Container & Update GitOps Repo
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in private GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "${GITOPS_TOKEN}" ]; then
            echo "::notice::GITOPS_TOKEN secret not configured yet; skipping automatic GitOps tag update."
            exit 0
          fi

          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          IMAGE_TAG="sha-${SHORT_SHA}"

          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" /tmp/gitops
          cd /tmp/gitops

          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/" overlays/prod/kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/prod/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(k8s): update fabaxi image tag to ${IMAGE_TAG}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
